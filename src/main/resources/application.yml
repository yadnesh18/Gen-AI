spring:
  application:
    name: qa-inference-service

  ai:
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:${GOOGLE_AI_API_KEY:}}
      chat:
        options:
          # Groq active models for this key: qwen/qwen3.8-27b, openai/gpt-oss-120b
          model: ${GROQ_MODEL_NAME:${GEMMA_MODEL_NAME:qwen/qwen3.8-27b}}
          temperature: ${GROQ_TEMPERATURE:${GEMMA_TEMPERATURE:0.3}}
          max-tokens: ${GROQ_MAX_TOKENS:${GEMMA_MAX_OUTPUT_TOKENS:2048}}

# Application-level tuning (separate from Spring AI's own HTTP client timeouts)
app:
  ai:
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.portfolio.qainference: INFO
